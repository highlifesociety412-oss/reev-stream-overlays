<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X2 Heat — Reev Cannon</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="shared.css">
<style>
.heat{position:absolute;left:1360px;top:24px;width:160px;height:72px}
.label{font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:2px;color:var(--cream);margin-bottom:6px}
.label.flash{color:var(--danger)}
.bars{display:flex;gap:6px;align-items:flex-end}
.bar{width:22px;height:36px;border-radius:4px;background:rgba(14,22,36,.9);border:1px solid rgba(183,192,204,.4)}
.bar.on{background:linear-gradient(180deg,#E11D2E 0%,#F5C542 100%);border-color:#E11D2E;box-shadow:0 0 8px #E11D2E}
.bar.lit{animation:pop 280ms ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.heat5{position:absolute;left:480px;top:800px;width:1040px;height:200px;opacity:0;pointer-events:none}
.heat5.show{opacity:1}
.heat5 .panel{position:relative;opacity:1;transform:none;border:2px solid #E11D2E;height:160px;top:20px;
  display:flex;flex-direction:column;justify-content:center;padding:24px 40px}
.heat5 .en{font-family:"Bebas Neue",sans-serif;font-size:52px;letter-spacing:2px;color:var(--cream)}
.heat5 .hi{margin-top:6px}
</style>
</head>
<body>

<div class="stage">
  <div class="heat" id="heat">
    <div class="label" id="label">HEAT • हीट</div>
    <div class="bars" id="bars"></div>
  </div>
  <div class="heat5" id="heat5">
    <div class="panel hold">
      <div class="en">HEAT 5 — all hands, stay in the car.</div>
      <div class="hi">हीट 5 — सब तैयार, कार में रहो।</div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
const barsEl=document.getElementById("bars");
const bars=[];
for(let i=0;i<5;i++){const b=document.createElement("div"); b.className="bar"; barsEl.appendChild(b); bars.push(b);}
let level = Math.max(0, Math.min(5, parseInt(OV.param("level","5"),10)||0));
const label=document.getElementById("label");
const heat5=document.getElementById("heat5");
function render(prev){
  bars.forEach((b,i)=>{
    const on=i<level;
    const was=b.classList.contains("on");
    b.classList.toggle("on", on);
    if (on && !was && !OV.isPreview()){ b.classList.remove("lit"); void b.offsetWidth; b.classList.add("lit"); }
  });
  label.textContent = "HEAT • हीट  " + level + "/5";
  if (level===5){ heat5.classList.add("show"); if(!OV.isPreview()) OV.play("heat-5"); }
  else heat5.classList.remove("show");
  if (level>prev && level<5 && !OV.isPreview()) OV.play("heat-up");
  if (level>prev){ label.classList.add("flash"); setTimeout(()=>label.classList.remove("flash"),200); }
}
render(-1);
window.setHeat=function(n){ const prev=level; level=Math.max(0,Math.min(5,+n||0)); render(prev); };
window.addEventListener("hashchange",()=>{ const m=location.hash.match(/level=(\d)/); if(m) setHeat(m[1]); });
window.addEventListener("message",e=>{ if(e.data && e.data.level!=null) setHeat(e.data.level); });
if (OV.isDemo() && !OV.isPreview()){
  let n=0; setInterval(()=>{ n = n===5?0:n+1; setHeat(n); }, 1800);
}
</script>
</body>
</html>
