<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P1 Star Drop — Reev Cannon</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="shared.css">
<style>
.badge{position:absolute;left:20px;top:20px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#F5C542 0%,#C4920A 75%);
  box-shadow:0 0 24px #F5C542;display:flex;align-items:center;justify-content:center;
  transform:scale(.6)}
.panel.show .badge{animation:badgein 340ms 80ms cubic-bezier(.2,1.4,.3,1) both}
.panel.hold .badge{transform:none;animation:none}
@keyframes badgein{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:none}}
.spark{width:72px;height:72px}
.spark polygon{fill:#070B12}
.copy{position:absolute;left:204px;top:16px;right:40px}
.amount{position:absolute;right:40px;top:52px}
.en{position:absolute;left:204px;top:112px;right:40px}
.hi{position:absolute;left:204px;top:148px;right:40px}
.underline{position:absolute;left:204px;top:100px;width:80px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,#F5C542,#16C47E)}
.panel{border:2px solid #F5C542}
.panel::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(196,146,10,.4)}
.shimmer{position:absolute;left:0;top:0;bottom:0;width:3px;background:#F5C542;opacity:0;border-radius:16px 0 0 16px}
.panel.hold .shimmer,.panel.show .shimmer{animation:shim 2000ms 800ms ease-in-out infinite}
@keyframes shim{0%,100%{opacity:0}50%{opacity:.35}}
.bits{position:absolute;left:100px;top:100px;width:0;height:0;pointer-events:none}
.bit{position:absolute;width:6px;height:6px;border-radius:50%;background:#F5C542;opacity:0}
.panel.show .bit,.panel.hold .bit{animation:bit 580ms 120ms ease-out forwards}
@keyframes bit{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
</style>
</head>
<body>

<div class="stage">
  <div class="alert-stage">
    <div class="panel" id="panel">
      <div class="badge">
        <svg class="spark" viewBox="0 0 72 72" aria-hidden="true">
          <polygon points="36,4 42,28 68,36 42,44 36,68 30,44 4,36 30,28"/>
        </svg>
      </div>
      <div class="bits" id="bits"></div>
      <div class="shimmer"></div>
      <div class="copy">
        <div class="kicker" id="kicker">STARS</div>
        <div class="name" id="name">Name</div>
      </div>
      <div class="underline"></div>
      <div class="amount" id="amount">0</div>
      <div class="en" id="en"></div>
      <div class="hi" id="hi"></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
const type = OV.param("type","stars");
const name = OV.ellipsis(OV.param("name","Alex"), 22);
const amount = OV.param("amount","50");
const copy = {
  stars: {k:"STARS", en:`${name} just sent ${amount} Stars! Love you for real.`, hi:`${name} ने ${amount} Stars भेजे! दिल से धन्यवाद।`},
  superchat: {k:"SUPER CHAT", en:`${name} just Super Chatted ${amount}! I see you.`, hi:`${name} ने ${amount} का Super Chat भेजा! मैंने देख लिया।`},
  sticker: {k:"SUPER STICKER", en:`${name} sent a Super Sticker ${amount}!`, hi:`${name} ने Super Sticker भेजा ${amount}!`},
  jewels: {k:"JEWELS", en:`${name} sent ${amount} Jewels!`, hi:`${name} ने ${amount} Jewels भेजे!`}
}[type] || {k:type.toUpperCase(), en:`${name} sent ${amount}!`, hi:`${name} ने ${amount} भेजे!`};
document.getElementById("kicker").textContent = copy.k;
document.getElementById("name").textContent = name;
document.getElementById("en").textContent = copy.en;
document.getElementById("hi").textContent = copy.hi;
const amt = document.getElementById("amount");
const panel = document.getElementById("panel");
const bits = document.getElementById("bits");
for (let i=0;i<16;i++){
  const b=document.createElement("div"); b.className="bit";
  const a = (Math.PI*2*i)/16, r=80+Math.random()*60;
  b.style.setProperty("--x", Math.cos(a)*r+"px");
  b.style.setProperty("--y", Math.sin(a)*r+"px");
  b.style.animationDelay = (120+Math.random()*80)+"ms";
  bits.appendChild(b);
}
function show(){
  panel.classList.remove("out","show","hold");
  void panel.offsetWidth;
  if (OV.isPreview()){ panel.classList.add("hold"); amt.textContent = amount; return; }
  panel.classList.add("show");
  OV.play("p1");
  const n = parseFloat(String(amount).replace(/[^0-9.]/g,"")) || 0;
  const prefix = String(amount).replace(/[0-9.]/g,"");
  const start = performance.now();
  function tick(t){
    const p = Math.min(1,(t-start)/280);
    const eased = 1-Math.pow(1-p,3);
    amt.textContent = prefix + (Number.isInteger(n) ? Math.round(n*eased) : (n*eased).toFixed(2));
    if (p<1) requestAnimationFrame(tick); else amt.textContent = amount;
  }
  requestAnimationFrame(tick);
  setTimeout(()=>panel.classList.add("out"), 6100);
}
show();
if (OV.isDemo()) setInterval(show, 8000);
</script>
</body>
</html>
